services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ires}
      POSTGRES_USER: ${DB_USER:-ires}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ires_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ires} -d ${DB_NAME:-ires}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ires_postgres_data: